<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="../imges/logo2.png">
  <link rel="apple-touch-icon" href="../imges/logo2.png">
  <title>وجهني - لوحة التحكم</title>
  <link rel="stylesheet" href="../css/bootstrap.css">
  <link rel="stylesheet" href="css/all.min.css" />
  <link rel="stylesheet" href="css/framework.css" />
  <link rel="stylesheet" href="css/master.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;500&display=swap" rel="stylesheet" />
</head>

<body>
  <div class="page d-flex">
    <div class="sidebar bg-white p-20 p-relative">
      <a class="p-relative logo txt-c mt-0" href="#"> <img src="../imges/logo.png" alt="logo"> </a>
      <ul>
        <li>
          <a class="d-flex align-center fs-14  rad-6 p-10" href="./dashboard.html">
            <i class="fa-regular fa-chart-bar fa-fw"></i>
            <span>لوحة التحكم</span>
          </a>
        </li>
        <li>
          <a class="d-flex align-center fs-14 c-black rad-6 p-10" href="settings.html">
            <i class="fa-solid fa-gear fa-fw"></i>
            <span>الاعدادات</span>
          </a>
        </li>
        <li>
          <a class="d-flex align-center fs-14 c-black rad-6 p-10" href="profile.html">
            <i class="fa-regular fa-user fa-fw"></i>
            <span>الملف الشخصي</span>
          </a>
        </li>
        <li>
          <a class="active d-flex align-center fs-14 c-black rad-6 p-10" href="projects.html">
            <i class="fa-solid fa-diagram-project fa-fw"></i>
            <span>المقالات</span>
          </a>
          <div class="m-2 Minu">
            <a class="active c-white fs-13 d-flex align-center fs-14 c-black rad-6 p-10" href="projects.html">
              <i class="fa-solid fa-pen"></i>
              <span>حذف او تعديل</span>
            </a>
            <a class="c-white fs-13 d-flex align-center fs-14 c-black rad-6 p-10" href="add-post/add-post.html">
              <i class="fa-solid fa-pen-to-square"></i>
              <span>اضافة مقال</span>
            </a>
            <a class="c-white fs-13 d-flex align-center fs-14 c-black rad-6 p-10" href="add-post/add-categoriy.html">
              <i class="fa-solid fa-table-list"></i>
              <span>الشعب</span>
            </a>
          </div>
        </li>
        <li>
          <a class="d-flex align-center fs-14 c-black rad-6 p-10" href="plans.html">
            <i class="fa-solid fa-star-half-stroke fa-fw"></i>
            <span>التقيمات</span>
          </a>
        </li>
      </ul>
    </div>
    <div class="content w-full">
      <!-- Start Head -->
      <div class="head bg-white p-15 between-flex">
        <div class="search p-relative">
          <input id="searchbar" onkeyup="blogSearch()" class="p-10" type="search" placeholder="ابحث عن مقال..." />
        </div>
        <div class="icons d-flex align-center">
          <button class="log-out" data-bs-toggle="modal" data-bs-target="#logoutModal" class="text-danger"><i
              class="fa-solid fa-right-from-bracket"></i></button>
          <img id="avatar" class="head-avatar" src="../imges/avatar.jpg" alt="avatar" />
        </div>
      </div>
      <!-- End Head -->
      <h1 class="p-relative">المقالات</h1>
      <div class="add-project-container col-12">
        <a href="add-post/add-post.html" class="add-project"><i class="fa-solid fa-plus"><span>اضافة مقاله
              جديده</span></i></a>
      </div>
      <div id="projects" class="projects-page row m-20 gap-20">
        <div id="cards-placeholder" class="d-flex row justify-content-center">
          <div class="cards col-lg-4 col-md-6 col-sm-12 placeholder-glow">
            <div class="h-100">
              <img class="card-img placeholder">
              <h5 class="card-text-loder">
                <span class="placeholder col-12"></span>
              </h5>
              <div class="card-body">
                <span class="placeholder col-5 mb-2"></span>
                <span class="placeholder col-6 mb-2"></span>
                <span class="placeholder col-8 mb-2"></span>
                <span class="placeholder col-6 mb-2"></span>
                <span class="placeholder col-8 mb-2"></span>
              </div>
            </div>
          </div>
          <div class="cards col-lg-4 col-md-6 col-sm-12 placeholder-glow">
            <div class="h-100">
              <img class="card-img placeholder">
              <h5 class="card-text-loder">
                <span class="placeholder col-12"></span>
              </h5>
              <div class="card-body">
                <span class="placeholder col-5 mb-2"></span>
                <span class="placeholder col-6 mb-2"></span>
                <span class="placeholder col-8 mb-2"></span>
                <span class="placeholder col-6 mb-2"></span>
                <span class="placeholder col-8 mb-2"></span>
              </div>
            </div>
          </div>
        </div>
        <div class="txt-c c-blue fs-25 fw-bold" id="search-container"></div>
      </div>
      <div id="noData" class="no-data"></div>
    </div>
    <div class="modal log-out-modal tab-pane fade" id="deletePostModal" tabindex="-1" role="dialog"
      aria-labelledby="exampleModalLabel" aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="exampleModalLabel">حذف الحساب</h5>
          </div>
          <div class="modal-body">
            <p>هل انت متاكد من انك تريد حذف المقال؟</p>
          </div>
          <input class="d-none" type="text" id="deletePostId" value="">
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-dismiss="modal"
              id="closedeleteProfileModal">لا</button>
            <button type="button" class="btn btn-danger" onclick="deleteProfile()">حذف المقال

            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- log out modal -->
    <div class="modal log-out-modal tab-pane fade" id="logoutModal" tabindex="-1" role="dialog"
      aria-labelledby="exampleModalLabel" aria-hidden="true">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="exampleModalLabel">تسجيل الخروج</h5>
          </div>
          <div class="modal-body">
            <p>هل انت متاكد من انك تريد تسجيل الخروج؟</p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-dismiss="modal" id="closeBtn">لا</button>
            <button type="button" class="btn btn-danger" onclick="logOut()">تسجيل الخروج </button>
          </div>
        </div>
      </div>
    </div>
    <script src="../js/axios.js"></script>
    <script src="./js/projects.js"></script>
    <script src="../js/bootstrap.min.js"></script>
    <script src="../js/search-module.js"></script>
</body>

</html>
